<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chia Đội Bóng Cân Bằng Trực Tuyến</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas xuất ảnh -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="syncStatus">Đang kết nối Cloud...</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
        ⚽ CHIA ĐỘI BÓNG ĐÁ TRỰC TUYẾN
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">Dữ liệu đồng bộ trực tiếp — Bất kỳ ai vào link cũng thấy và sửa được</p>
    </header>

    <!-- Khu vực nhập liệu & danh sách -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Cột trái: Thêm cầu thủ -->
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 space-y-4">
        <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-user-plus"></i> Thêm Cầu Thủ Mới
        </h2>
        <div class="space-y-3 text-sm">
          <div>
            <label class="block text-slate-400 mb-1">Tên cầu thủ:</label>
            <input id="playerName" type="text" placeholder="VD: Văn Toàn, Tuấn..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-slate-400">Điểm đánh giá (1 - 5 ⭐):</label>
              <span id="scoreVal" class="text-emerald-400 font-bold">3.0 ⭐</span>
            </div>
            <input id="playerScore" type="range" min="1" max="5" step="0.5" value="3.0" class="w-full accent-emerald-500 cursor-pointer">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Vị trí sở trường:</label>
            <select id="playerPos" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
              <option value="MF">Tiền vệ (MF)</option>
              <option value="FW">Tiền đạo (FW)</option>
              <option value="DF">Hậu vệ (DF)</option>
              <option value="GK">Thủ môn (GK)</option>
            </select>
          </div>
          <button id="btnAdd" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow">
            <i class="fa-solid fa-plus"></i> Thêm Vào Danh Sách
          </button>
        </div>
      </div>

      <!-- Cột giữa & phải: Danh sách cầu thủ -->
      <div class="lg:col-span-2 bg-slate-800/80 p-5 rounded-2xl border border-slate-700 space-y-4 flex flex-col justify-between">
        <div>
          <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-700 pb-3">
            <h2 class="text-base font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-users"></i> Danh Sách Thi Đấu (<span id="playerCount" class="text-emerald-400">0</span>)
            </h2>
            <div class="flex gap-2">
              <button id="btnCheckAll" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">Chọn tất cả</button>
              <button id="btnClearAll" class="text-xs bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 px-3 py-1.5 rounded-lg">Xóa hết</button>
            </div>
          </div>
          
          <!-- Bảng cuộn danh sách -->
          <div class="overflow-y-auto max-h-72 mt-3 space-y-2 pr-1" id="playerList">
            <!-- Danh sách render tự động -->
          </div>
        </div>

        <!-- Cấu hình chia đội -->
        <div class="pt-4 border-t border-slate-700 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-3 text-sm">
            <div class="flex items-center gap-2">
              <label class="text-slate-300">Chia làm:</label>
              <select id="teamCount" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white">
                <option value="2">2 Đội (Đối kháng)</option>
                <option value="3">3 Đội (Xoay tua)</option>
                <option value="4">4 Đội (Giải mini)</option>
              </select>
            </div>
            <label class="flex items-center gap-2 text-slate-300 cursor-pointer">
              <input id="splitGK" type="checkbox" checked class="accent-emerald-500 w-4 h-4">
              <span>Chia đều Thủ môn (GK)</span>
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button id="btnSplit" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-shuffle"></i> BẮT ĐẦU CHIA ĐỘI
            </button>
            <button id="btnExportImg" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera"></i> TẢI ẢNH KẾT QUẢ (PNG)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Khu vực hiển thị kết quả -->
    <div id="resultContainer" class="hidden bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-5">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <div>
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-trophy text-amber-400"></i> Kết Quả Chia Đội
          </h3>
          <p id="diffRating" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <button id="btnCopyText" class="text-xs bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
          <i class="fa-solid fa-copy"></i> Copy gửi Zalo
        </button>
      </div>

      <!-- Danh sách card các đội (Được chụp ra ảnh PNG) -->
      <div id="teamsExportArea" class="p-4 bg-slate-950 rounded-xl border border-slate-800">
        <div class="text-center pb-3 border-b border-slate-800 mb-4">
          <h4 class="text-emerald-400 font-extrabold text-lg">⚽ ĐỘI HÌNH THI ĐẤU HÔM NAY</h4>
          <p class="text-slate-500 text-xs" id="matchTime"></p>
        </div>
        <div id="teamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Render các đội -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CẤU HÌNH FIREBASE REALTIME CỦA BẠN
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC4xMEGFeempcb4PpEj2-Gx68okH_hOq0A",
      authDomain: "chia-doi.firebaseapp.com",
      databaseURL: "https://chia-doi-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chia-doi",
      storageBucket: "chia-doi.firebasestorage.app",
      messagingSenderId: "376431137461",
      appId: "1:376431137461:web:ad3933fef357224ad524fc"
    };

    // Khởi tạo Firebase
    let db = null;
    let playersRef = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      playersRef = db.ref('match_data/players');
      document.getElementById('syncStatus').innerText = 'Cloud: Đồng bộ trực tuyến';
    } catch (e) {
      console.error(e);
      document.getElementById('syncStatus').innerText = 'Lỗi kết nối Firebase';
    }

    let players = [];

    // Lắng nghe dữ liệu thay đổi từ Firebase Realtime
    if (playersRef) {
      playersRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          players = Array.isArray(data) ? data : Object.values(data);
        } else {
          players = [];
        }
        renderPlayerList();
      });
    }

    // Hàm lưu danh sách lên Firebase
    function saveToCloud() {
      if (playersRef) {
        playersRef.set(players);
      }
    }

    // Cập nhật giá trị slider
    const playerScore = document.getElementById('playerScore');
    const scoreVal = document.getElementById('scoreVal');
    playerScore.addEventListener('input', (e) => {
      scoreVal.innerText = parseFloat(e.target.value).toFixed(1) + ' ⭐';
    });

    // Thêm cầu thủ
    document.getElementById('btnAdd').addEventListener('click', () => {
      const nameInput = document.getElementById('playerName');
      const name = nameInput.value.trim();
      if (!name) return alert('Vui lòng nhập tên cầu thủ!');

      const newPlayer = {
        id: Date.now().toString(),
        name: name,
        score: parseFloat(playerScore.value),
        pos: document.getElementById('playerPos').value,
        active: true
      };

      players.push(newPlayer);
      saveToCloud();
      nameInput.value = '';
    });

    // Render danh sách cầu thủ
    function renderPlayerList() {
      const container = document.getElementById('playerList');
      container.innerHTML = '';
      document.getElementById('playerCount').innerText = players.length;

      if (players.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">Chưa có ai trong danh sách. Hãy thêm cầu thủ!</p>';
        return;
      }

      players.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2.5 rounded-xl border text-sm transition ${
          p.active ? 'bg-slate-900/90 border-slate-700' : 'bg-slate-900/40 border-slate-800 opacity-50'
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${p.active ? 'checked' : ''} onchange="togglePlayer(${idx})" class="w-4 h-4 accent-emerald-500 cursor-pointer">
            <span class="px-2 py-0.5 text-xs font-bold rounded ${getPosBadge(p.pos)}">${p.pos}</span>
            <span class="font-medium text-slate-200">${p.name}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg">
              <button onclick="changeScore(${idx}, -0.5)" class="text-slate-400 hover:text-white px-1">-</button>
              <span class="text-amber-400 font-bold text-xs">${p.score.toFixed(1)}⭐</span>
              <button onclick="changeScore(${idx}, 0.5)" class="text-slate-400 hover:text-white px-1">+</button>
            </div>
            <button onclick="deletePlayer(${idx})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function getPosBadge(pos) {
      if (pos === 'GK') return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
      if (pos === 'DF') return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
      if (pos === 'MF') return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
      return 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
    }

    window.togglePlayer = (idx) => {
      players[idx].active = !players[idx].active;
      saveToCloud();
    };

    window.changeScore = (idx, delta) => {
      let ns = Math.round((players[idx].score + delta) * 10) / 10;
      if (ns >= 1 && ns <= 5) {
        players[idx].score = ns;
        saveToCloud();
      }
    };

    window.deletePlayer = (idx) => {
      players.splice(idx, 1);
      saveToCloud();
    };

    document.getElementById('btnCheckAll').addEventListener('click', () => {
      const allActive = players.every(p => p.active);
      players.forEach(p => p.active = !allActive);
      saveToCloud();
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      if (confirm('Bạn có chắc chắn muốn xóa toàn bộ danh sách?')) {
        players = [];
        saveToCloud();
      }
    });

    // ==========================================
    // 2. THUẬT TOÁN CHIA ĐỘI CÂN BẰNG
    // ==========================================
    let currentTeams = [];

    document.getElementById('btnSplit').addEventListener('click', () => {
      const activeList = players.filter(p => p.active);
      const k = parseInt(document.getElementById('teamCount').value);
      const splitGK = document.getElementById('splitGK').checked;

      if (activeList.length < k) {
        return alert(`Cần ít nhất ${k} người có mặt để chia làm ${k} đội!`);
      }

      let gks = [];
      let nonGks = [];

      if (splitGK) {
        gks = activeList.filter(p => p.pos === 'GK').sort(() => Math.random() - 0.5);
        nonGks = activeList.filter(p => p.pos !== 'GK').sort(() => Math.random() - 0.5);
      } else {
        nonGks = [...activeList].sort(() => Math.random() - 0.5);
      }

      let teams = Array.from({ length: k }, (_, i) => ({
        id: i + 1,
        name: `Đội ${String.fromCharCode(65 + i)}`,
        players: [],
        totalScore: 0
      }));

      // Chia thủ môn trước
      gks.forEach(p => {
        teams.sort((a, b) => a.players.length - b.players.length || a.totalScore - b.totalScore);
        teams[0].players.push(p);
        teams[0].totalScore += p.score;
      });

      // Sắp xếp các vị trí còn lại kèm xáo trộn ngẫu nhiên
      nonGks.sort((a, b) => b.score - a.score + (Math.random() * 0.4 - 0.2));

      nonGks.forEach(p => {
        teams.sort((a, b) => a.players.length - b.players.length || a.totalScore - b.totalScore);
        teams[0].players.push(p);
        teams[0].totalScore += p.score;
      });

      currentTeams = teams;
      renderTeamsResult();
    });

    function renderTeamsResult() {
      const container = document.getElementById('teamsGrid');
      container.innerHTML = '';
      document.getElementById('resultContainer').classList.remove('hidden');

      const scores = currentTeams.map(t => t.totalScore);
      const diff = Math.max(...scores) - Math.min(...scores);
      document.getElementById('diffRating').innerText = `Chênh lệch: ${diff.toFixed(1)} điểm — ${diff <= 0.5 ? '🔥 Rất cân bằng' : '👍 Ổn định'}`;
      document.getElementById('matchTime').innerText = `Ngày chia: ${new Date().toLocaleDateString('vi-VN')} lúc ${new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})}`;

      const colors = ['border-emerald-500 bg-emerald-500/10', 'border-blue-500 bg-blue-500/10', 'border-amber-500 bg-amber-500/10', 'border-rose-500 bg-rose-500/10'];

      currentTeams.forEach((team, i) => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border-2 ${colors[i % colors.length]} space-y-3`;
        
        let pListHtml = team.players.map(p => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-slate-800">
            <span class="text-slate-300 font-medium">${p.name} <span class="text-slate-500">(${p.pos})</span></span>
            <span class="text-amber-400 font-bold">${p.score.toFixed(1)}⭐</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-slate-800">
            <h5 class="font-extrabold text-base text-white">${team.name}</h5>
            <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-emerald-400 font-bold">${team.players.length} người | ${team.totalScore.toFixed(1)}đ</span>
          </div>
          <div class="space-y-1">${pListHtml}</div>
        `;
        container.appendChild(card);
      });
    }

    // Tải ảnh PNG chất lượng cao
    document.getElementById('btnExportImg').addEventListener('click', () => {
      const target = document.getElementById('teamsExportArea');
      if (currentTeams.length === 0) return alert('Vui lòng chia đội trước khi xuất ảnh!');

      html2canvas(target, { scale: 2, backgroundColor: '#020617' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `ket-qua-chia-doi-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });

    // Copy text gửi Zalo
    document.getElementById('btnCopyText').addEventListener('click', () => {
      if (currentTeams.length === 0) return;
      let text = `⚽ KẾT QUẢ CHIA ĐỘI HÔM NAY ⚽\n`;
      currentTeams.forEach(t => {
        text += `\n📌 ${t.name} (${t.players.length} người - ${t.totalScore.toFixed(1)}đ):\n`;
        t.players.forEach(p => text += `- ${p.name} (${p.pos} - ${p.score}⭐)\n`);
      });
      navigator.clipboard.writeText(text).then(() => alert('Đã sao chép nội dung gửi Zalo!'));
    });
  </script>
</body>
</html>
